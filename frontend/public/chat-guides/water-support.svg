<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" rx="40" fill="#F7F7F0"/>
  <rect x="48" y="48" width="1104" height="704" rx="32" fill="white" stroke="#D9E2CF" stroke-width="2"/>
  <text x="80" y="118" fill="#233127" font-family="Arial, sans-serif" font-size="42" font-weight="700">Water and Supportive Care</text>
  <text x="80" y="156" fill="#627161" font-family="Arial, sans-serif" font-size="22">When birds are weak, water access becomes one of the most important checks</text>
  <path d="M228 256C228 210 266 172 312 172C358 172 396 210 396 256V524C396 570 358 608 312 608C266 608 228 570 228 524V256Z" fill="#DFF1F8"/>
  <rect x="258" y="254" width="108" height="292" rx="42" fill="#8FD0E5"/>
  <text x="488" y="282" fill="#233127" font-family="Arial, sans-serif" font-size="30" font-weight="700">Farmer checklist</text>
  <text x="488" y="342" fill="#627161" font-family="Arial, sans-serif" font-size="24">1. Replace stale water and flush lines</text>
  <text x="488" y="390" fill="#627161" font-family="Arial, sans-serif" font-size="24">2. Make sure weak birds can reach drinkers</text>
  <text x="488" y="438" fill="#627161" font-family="Arial, sans-serif" font-size="24">3. Watch for crowding around water points</text>
  <text x="488" y="486" fill="#627161" font-family="Arial, sans-serif" font-size="24">4. Compare water use with yesterday if possible</text>
  <rect x="478" y="558" width="576" height="92" rx="24" fill="#EEF7F0" stroke="#C9E2CF" stroke-width="2"/>
  <text x="512" y="614" fill="#25543B" font-family="Arial, sans-serif" font-size="24" font-weight="700">Tip:</text>
  <text x="580" y="614" fill="#25543B" font-family="Arial, sans-serif" font-size="24">If birds stop drinking, the problem can worsen very quickly.</text>
</svg>
