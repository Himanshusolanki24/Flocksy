  <text x="80" y="118" fill="#233127" font-family="Arial, sans-serif" font-size="42" font-weight="700">Newcastle Disease: Field Signs</text>
  <text x="80" y="156" fill="#627161" font-family="Arial, sans-serif" font-size="22">Quick visual guide for farmers during flock inspection</text>
  <g>
